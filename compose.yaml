name: fx-trader
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: fx_trader
      POSTGRES_USER: fx_trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup-db.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx_trader -d fx_trader"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
